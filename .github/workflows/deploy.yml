name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once; queue them instead of racing on the VM.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VM_USER: dn-sec
  APP_DIR: /opt/dn-sec

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Materialize the production env file from a single GitHub secret.
      # umask 077 so the temp file is never group/world-readable on the runner.
      - name: Write production env file
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          umask 077
          printf '%s' "$PROD_ENV" > prod.env
          test -s prod.env || { echo "PROD_ENV secret is empty"; exit 1; }

      - name: Upload env and deploy
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          # Ship secrets first, then pull code, build, and restart.
          scp -i ~/.ssh/deploy_key prod.env "$VM_USER@$VM_HOST:$APP_DIR/.env"
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" bash <<'DEPLOY'
            set -euo pipefail
            cd /opt/dn-sec

            chmod 600 .env

            git fetch origin main
            git reset --hard origin/main

            # PDF export is disabled on this box — skip the ~150 MB Chromium
            # download that puppeteer would otherwise fetch (and OOM the e2-micro).
            PUPPETEER_SKIP_DOWNLOAD=true npm ci --legacy-peer-deps
            npm run build

            # If the systemd unit itself changed, reinstall it before restarting.
            # Absolute paths so the narrow NOPASSWD sudoers rule matches exactly.
            if ! cmp -s deploy/dn-sec.service /etc/systemd/system/dn-sec.service; then
              sudo /usr/bin/cp /opt/dn-sec/deploy/dn-sec.service /etc/systemd/system/dn-sec.service
              sudo /usr/bin/systemctl daemon-reload
            fi

            sudo /usr/bin/systemctl restart dn-sec
            sleep 2
            sudo /usr/bin/systemctl is-active dn-sec
          DEPLOY

      - name: Remove local secret
        if: always()
        run: rm -f prod.env

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://dn-sec.com/ > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 5 attempts"
          exit 1
